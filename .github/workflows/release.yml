name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Get latest release tag
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

      - name: Verify tag and versions
        shell: bash
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const tag = process.env.GITHUB_REF_NAME;
          const latest = (process.env.LATEST_TAG || '').replace(/^v/, '');
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];

          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };

          const parts = (version, label) => {
            if (!/^\d+\.\d+\.\d+/.test(version)) fail(`${label} is not semver: ${version}`);
            return version.split(/[.+-]/).slice(0, 3).map(Number);
          };

          const compare = (a, b) => {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] > b[i] ? 1 : -1;
            }
            return 0;
          };

          if (!cargo) fail('version missing from src-tauri/Cargo.toml');
          if (tag !== `v${tauri}`) fail(`tag ${tag} does not match tauri.conf.json version ${tauri}`);
          if (pkg !== tauri) fail(`package.json version ${pkg} does not match tauri.conf.json version ${tauri}`);
          if (cargo !== tauri) fail(`Cargo.toml version ${cargo} does not match tauri.conf.json version ${tauri}`);
          if (latest && compare(parts(tauri, 'release version'), parts(latest, 'latest release')) <= 0) {
            fail(`release version ${tauri} is not higher than latest ${latest}`);
          }
          NODE

      - run: npm ci
      - run: npm run build
      - run: npm run tauri build

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
