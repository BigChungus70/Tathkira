<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tathkira</title>
  </head>
  <body>
    <main class="app">
      <div class="titlebar" data-tauri-drag-region>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-copy">
            <h1 class="title" data-i18n="app.title"></h1>
            <p class="subtitle" data-i18n="app.subtitle"></p>
          </div>
        </div>
        <div class="window-controls">
          <button id="win-minimize" type="button" data-i18n-label="actions.hide">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" /></svg>
          </button>
        </div>
      </div>

      <section class="section pool-card">
        <div class="section-head">
          <h2 class="section-title">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5" /></svg>
            <span data-i18n="sections.pool"></span>
            <span id="pool-count" class="count">0</span>
          </h2>
        </div>
        <button id="open-pool" type="button" class="primary wide">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
          <span data-i18n="actions.managePool"></span>
        </button>
      </section>

      <div class="settings-grid aligned-grid">
        <section class="section">
          <h2 class="section-title">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
            <span data-i18n="sections.timing"></span>
          </h2>
          <label class="field">
            <span class="field-label" data-i18n="fields.interval"></span>
            <span class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
              <input id="interval" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" />
              <span class="input-unit" data-i18n="fields.minutes"></span>
            </span>
          </label>
          <label class="field">
            <span class="field-label" data-i18n="fields.onScreen"></span>
            <span class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z" /><circle cx="12" cy="12" r="2.5" /></svg>
              <input id="display" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" />
              <span class="input-unit" data-i18n="fields.seconds"></span>
            </span>
          </label>
        </section>

        <section class="section">
          <h2 class="section-title">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></svg>
            <span data-i18n="sections.position"></span>
          </h2>
          <div id="position-grid" class="position-grid">
            <button type="button" data-position="top_left">↖</button>
            <button type="button" data-position="top_center">↑</button>
            <button type="button" data-position="top_right">↗</button>
            <button type="button" data-position="middle_left">←</button>
            <button type="button" data-position="middle_center">•</button>
            <button type="button" data-position="middle_right">→</button>
            <button type="button" data-position="bottom_left">↙</button>
            <button type="button" data-position="bottom_center">↓</button>
            <button type="button" data-position="bottom_right">↘</button>
          </div>
        </section>
      </div>

      <section class="section snooze">
        <h2 class="section-title">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8 8 0 018.5 4 8 8 0 1020 15.5z" /><path d="M17 4v4M15 6h4" /></svg>
          <span data-i18n="sections.snooze"></span>
        </h2>
        <div class="snooze-control-row">
          <label class="field snooze-field">
            <span class="field-label" data-i18n="fields.snoozeFor"></span>
            <span class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3v3c0 3 4 4 4 6s-4 3-4 6v3M16 3v3c0 3-4 4-4 6s4 3 4 6v3" /></svg>
              <input id="snooze-minutes" type="text" inputmode="numeric" value="15" autocomplete="off" spellcheck="false" />
              <span class="input-unit" data-i18n="fields.minutes"></span>
            </span>
          </label>
          <div class="snooze-buttons">
            <button id="snooze-apply" type="button" class="primary icon-text">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l3 2M9 2h6M12 2v3" /></svg>
              <span data-i18n="actions.snooze"></span>
            </button>
            <button id="snooze-cancel" type="button" class="icon-button" data-i18n-label="actions.cancelSnooze" disabled>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
        </div>
        <div class="preset-row">
          <span class="preset-label" data-i18n="presets.quick"></span>
          <button type="button" data-minutes="15" data-i18n="presets.m15"></button>
          <button type="button" data-minutes="30" data-i18n="presets.m30"></button>
          <button type="button" data-minutes="60" data-i18n="presets.h1"></button>
        </div>
        <div id="snooze-state" class="snooze-state" role="status"></div>
      </section>

      <section class="section compact startup-section">
        <label class="checkbox-field">
          <input id="launch-on-startup" type="checkbox" />
          <span data-i18n="fields.launchOnStartup"></span>
        </label>
      </section>

      <div class="settings-grid">
        <section class="section compact">
          <label class="field">
            <span class="field-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" /></svg>
              <span id="language-label" data-i18n="sections.language"></span>
            </span>
            <div id="language-select" class="language-select">
              <button id="language-trigger" type="button" class="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-menu" aria-labelledby="language-label">
                <span id="language-value"></span>
                <svg class="icon select-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
              </button>
              <div id="language-menu" class="select-menu" role="listbox" hidden></div>
            </div>
          </label>
        </section>

        <section class="section compact">
          <div class="field">
            <span class="field-label">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 100 18h1.5a2.5 2.5 0 000-5H12a3 3 0 010-6h6a3 3 0 003-3 4 4 0 00-4-4h-5z" /><circle cx="7.5" cy="9" r="1" /><circle cx="10" cy="6.5" r="1" /><circle cx="7" cy="14" r="1" /></svg>
              <span data-i18n="sections.theme"></span>
            </span>
            <div id="theme-picker" class="theme-picker" role="group" data-i18n-label="themes.label">
              <button type="button" data-theme-choice="system" data-i18n-label="themes.system">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
              </button>
              <button type="button" data-theme-choice="dark" data-i18n-label="themes.dark">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8 8 0 018.5 4 8 8 0 1020 15.5z" /></svg>
              </button>
              <button type="button" data-theme-choice="light" data-i18n-label="themes.light">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
              </button>
            </div>
          </div>
        </section>
      </div>

      <footer>
        <span id="status" class="status" role="status"></span>
        <button id="quit" type="button" class="danger-outline">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9" /><path d="M6.3 6.3a8 8 0 1011.4 0" /></svg>
          <span data-i18n="actions.quit"></span>
        </button>
      </footer>
      <div class="blur-layer" aria-hidden="true"></div>
    </main>
    <script src="/i18n.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
