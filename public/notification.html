<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, 'Geeza Pro', Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .card {
        position: absolute;
        inset: 8px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        color: #eaf2ee;
        background: linear-gradient(135deg, rgba(23, 32, 38, 0.97), rgba(16, 23, 28, 0.97));
        border: 1px solid rgba(148, 180, 168, 0.22);
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        opacity: 0;
        transform: translateY(10px) scale(0.985);
        transition: opacity 180ms ease, transform 220ms ease;
        cursor: pointer;
        user-select: none;
      }

      .card.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .accent {
        width: 4px;
        height: calc(100% - 16px);
        min-height: 34px;
        flex: none;
        border-radius: 999px;
        background: linear-gradient(180deg, #8ff0c9, #34d399);
        box-shadow: 0 0 18px rgba(52, 211, 153, 0.35);
      }

      #text {
        flex: 1;
        min-width: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: 0.005em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="accent"></div>
      <div id="text"></div>
    </div>

    <script src="./i18n.js"></script>
    <script>
      (function () {
        const i18n = window.TathkiraI18n;
        const card = document.getElementById('card');
        const textEl = document.getElementById('text');
        let hideTimer = null;
        let dismissing = false;

        function hide() {
          if (dismissing) return;
          dismissing = true;
          card.classList.remove('visible');
          clearTimeout(hideTimer);
          const api = window.__TAURI__;
          if (api && api.core && api.core.invoke) {
            api.core.invoke('hide_notification').catch(function () {});
          }
          setTimeout(function () {
            dismissing = false;
          }, 250);
        }

        function textDirection(value) {
          return /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/u.test(value) ? 'rtl' : 'ltr';
        }

        function measureTextHeight() {
          const style = getComputedStyle(textEl);
          const probe = document.createElement('div');
          probe.style.position = 'fixed';
          probe.style.left = '-9999px';
          probe.style.top = '0';
          probe.style.width = Math.max(textEl.getBoundingClientRect().width, 240) + 'px';
          probe.style.fontFamily = style.fontFamily;
          probe.style.fontSize = style.fontSize;
          probe.style.fontWeight = style.fontWeight;
          probe.style.lineHeight = style.lineHeight;
          probe.style.letterSpacing = style.letterSpacing;
          probe.style.whiteSpace = 'pre-wrap';
          probe.style.overflowWrap = 'anywhere';
          probe.style.visibility = 'hidden';
          probe.textContent = textEl.textContent;
          document.body.appendChild(probe);
          const height = probe.scrollHeight;
          probe.remove();
          return height;
        }

        function resizeToText() {
          const api = window.__TAURI__;
          const height = Math.max(80, Math.ceil(measureTextHeight() + 52));
          if (!api || !api.window || !api.window.getCurrentWindow) return;
          const windowApi = api.window.getCurrentWindow();
          if (!windowApi.setSize) return;
          windowApi
            .setSize({ width: 350, height: height })
            .then(function () {
              if (api.core && api.core.invoke) {
                api.core
                  .invoke('reposition_notification', { width: 350, height: height })
                  .catch(function () {});
              }
            })
            .catch(function () {});
        }

        function show(payload) {
          if (!payload) return;
          const value = payload.text || '';
          const direction = textDirection(value);
          textEl.textContent = value;
          textEl.dir = direction;
          textEl.style.textAlign = direction === 'rtl' ? 'right' : 'left';
          card.style.flexDirection = direction === 'rtl' ? 'row-reverse' : 'row';
          dismissing = false;
          clearTimeout(hideTimer);
          card.classList.remove('visible');
          void card.offsetWidth;
          card.classList.add('visible');
          requestAnimationFrame(resizeToText);
          const duration = Number(payload.duration_ms);
          hideTimer = setTimeout(hide, Number.isFinite(duration) ? duration : 8000);
        }

        card.addEventListener('click', hide);

        let attempts = 0;
        const poll = setInterval(function () {
          attempts += 1;
          const api = window.__TAURI__;
          if (api && api.event && api.event.listen) {
            clearInterval(poll);
            api.event.listen('show-notification', function (event) {
              const payload = event.payload || {};
              if (!i18n) {
                show(payload);
                return;
              }
              i18n
                .load(payload.language || 'en')
                .then(function () {
                  show(payload);
                })
                .catch(function () {
                  show(payload);
                });
            });
          } else if (attempts >= 50) {
            clearInterval(poll);
          }
        }, 100);
      })();
    </script>
  </body>
</html>
