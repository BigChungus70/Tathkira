<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI Variable', 'Segoe UI', ui-sans-serif, system-ui, Tahoma, 'Geeza Pro', sans-serif;
        --card-bg: #181a17;
        --card-text: #f5f1e6;
        --accent: #d2b27a;
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --card-bg: #fffdf7;
        --card-text: #262a24;
        --accent: #8a6b32;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .card {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 14px 16px;
        color: var(--card-text);
        background: var(--card-bg);
        border: 0;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 160ms ease, transform 180ms ease;
        cursor: pointer;
        user-select: none;
      }

      .card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .accent {
        width: 3px;
        height: calc(100% - 14px);
        min-height: 32px;
        flex: none;
        border-radius: 999px;
        background: var(--accent);
      }

      #text {
        flex: 1;
        min-width: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="accent"></div>
      <div id="text"></div>
    </div>

    <script src="./i18n.js"></script>
    <script>
      (function () {
        const i18n = window.TathkiraI18n;
        const card = document.getElementById('card');
        const textEl = document.getElementById('text');
        let hideTimer = null;
        let dismissing = false;

        function hide() {
          if (dismissing) return;
          dismissing = true;
          card.classList.remove('visible');
          clearTimeout(hideTimer);
          const api = window.__TAURI__;
          if (api && api.core && api.core.invoke) {
            api.core.invoke('hide_notification').catch(function () {});
          }
          setTimeout(function () {
            dismissing = false;
          }, 250);
        }

        function textDirection(value) {
          return /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/u.test(value) ? 'rtl' : 'ltr';
        }

        function measureTextHeight() {
          const style = getComputedStyle(textEl);
          const probe = document.createElement('div');
          probe.style.position = 'fixed';
          probe.style.left = '-9999px';
          probe.style.top = '0';
          probe.style.width = Math.max(textEl.getBoundingClientRect().width, 240) + 'px';
          probe.style.fontFamily = style.fontFamily;
          probe.style.fontSize = style.fontSize;
          probe.style.fontWeight = style.fontWeight;
          probe.style.lineHeight = style.lineHeight;
          probe.style.letterSpacing = style.letterSpacing;
          probe.style.whiteSpace = 'pre-wrap';
          probe.style.overflowWrap = 'anywhere';
          probe.style.visibility = 'hidden';
          probe.textContent = textEl.textContent;
          document.body.appendChild(probe);
          const height = probe.scrollHeight;
          probe.remove();
          return height;
        }

        function resizeToText() {
          const api = window.__TAURI__;
          const height = Math.max(80, Math.ceil(measureTextHeight() + 36));
          if (!api || !api.core || !api.core.invoke) return;
          api.core.invoke('resize_notification', { height: height }).catch(function () {});
        }

        function show(payload) {
          if (!payload) return;
          const theme = payload.theme === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          const value = payload.text || '';
          const direction = textDirection(value);
          textEl.textContent = value;
          textEl.dir = direction;
          textEl.style.textAlign = direction === 'rtl' ? 'right' : 'left';
          card.style.flexDirection = direction === 'rtl' ? 'row-reverse' : 'row';
          dismissing = false;
          clearTimeout(hideTimer);
          card.classList.remove('visible');
          void card.offsetWidth;
          card.classList.add('visible');
          requestAnimationFrame(resizeToText);
          const duration = Number(payload.duration_ms);
          hideTimer = setTimeout(hide, Number.isFinite(duration) ? duration : 8000);
        }

        card.addEventListener('click', hide);

        let attempts = 0;
        const poll = setInterval(function () {
          attempts += 1;
          const api = window.__TAURI__;
          if (api && api.event && api.event.listen) {
            clearInterval(poll);
            api.event.listen('show-notification', function (event) {
              const payload = event.payload || {};
              if (!i18n) {
                show(payload);
                return;
              }
              i18n
                .load(payload.language || 'en')
                .then(function () {
                  show(payload);
                })
                .catch(function () {
                  show(payload);
                });
            });
          } else if (attempts >= 50) {
            clearInterval(poll);
          }
        }, 100);
      })();
    </script>
  </body>
</html>
