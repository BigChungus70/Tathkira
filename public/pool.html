<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tathkira</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, 'Geeza Pro', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        --bg: #0d1216;
        --surface: rgba(22, 30, 36, 0.92);
        --surface-2: #1a2329;
        --border: rgba(148, 180, 168, 0.14);
        --border-strong: rgba(148, 180, 168, 0.26);
        --text: #eaf2ee;
        --muted: #8ea49a;
        --accent: #6ee7b7;
        --accent-strong: #34d399;
        --accent-ink: #072419;
        --danger: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 0%, rgba(70, 211, 159, 0.08), transparent 40%),
          linear-gradient(160deg, #0f1519 0%, var(--bg) 60%);
      }

      main {
        height: 100vh;
        padding: 0 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        margin: 0 -16px;
        padding: 16px 18px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: linear-gradient(180deg, rgba(15, 21, 25, 0.98), rgba(15, 21, 25, 0.74));
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(14px);
        user-select: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        flex: none;
        border-radius: 9px;
        background: linear-gradient(145deg, var(--accent), #2f9e7a);
        box-shadow: 0 0 0 4px rgba(110, 231, 183, 0.08), 0 8px 18px rgba(52, 211, 153, 0.2);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .count {
        min-width: 26px;
        padding: 4px 9px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        background: rgba(110, 231, 183, 0.1);
        border: 1px solid rgba(110, 231, 183, 0.2);
        border-radius: 999px;
      }

      .pool {
        flex: 1;
        min-height: 0;
        padding-right: 2px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 9px;
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }

      .pool::-webkit-scrollbar {
        width: 6px;
      }

      .pool::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 999px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      }

      textarea {
        flex: 1;
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 40px;
        padding: 9px 11px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        outline: none;
        font: inherit;
        line-height: 1.5;
        resize: none;
        overflow: hidden;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.14);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: none;
      }

      button {
        padding: 9px 12px;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
        transition: transform 120ms ease, background 140ms ease, border-color 140ms ease;
      }

      button:hover {
        background: #27343c;
        border-color: rgba(148, 180, 168, 0.4);
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        color: var(--accent-ink);
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        border-color: transparent;
        font-weight: 700;
        box-shadow: 0 8px 18px rgba(52, 211, 153, 0.18);
      }

      button.primary:hover {
        background: linear-gradient(135deg, #8ff0c9, #41d9a2);
      }

      button.danger {
        color: var(--danger);
        background: transparent;
        border-color: transparent;
      }

      button.danger:hover {
        color: #fca5a5;
        background: rgba(248, 113, 113, 0.1);
        border-color: rgba(248, 113, 113, 0.3);
      }

      .composer {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 11px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .composer:focus-within {
        border-color: rgba(110, 231, 183, 0.35);
        box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.08);
      }

      .status {
        min-height: 16px;
        font-size: 11px;
        color: var(--accent);
      }

      footer {
        display: flex;
        justify-content: flex-end;
      }

      .wide {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <header data-tauri-drag-region>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 data-i18n="sections.pool"></h1>
        </div>
        <span id="pool-count" class="count">0</span>
      </header>

      <div id="pool" class="pool"></div>

      <form id="add-form" class="composer">
        <textarea id="new-text" rows="1" data-i18n-placeholder="fields.placeholder" placeholder=""></textarea>
        <button type="submit" class="primary" data-i18n="actions.add"></button>
      </form>

      <div id="status" class="status" role="status"></div>
      <footer>
        <button id="done" type="button" class="primary wide" data-i18n="actions.done"></button>
      </footer>
    </main>
    <script src="./i18n.js"></script>
    <script>
      (function () {
        const i18n = window.TathkiraI18n;
        const api = window.__TAURI__;
        const pool = document.getElementById('pool');
        const status = document.getElementById('status');
        let config = { texts: [], language: 'en' };
        let statusTimer;

        function setStatus(message) {
          status.textContent = message;
          clearTimeout(statusTimer);
          statusTimer = setTimeout(function () {
            status.textContent = '';
          }, 1600);
        }

        function applyTranslations() {
          document.querySelectorAll('[data-i18n]').forEach(function (element) {
            element.textContent = i18n.t(element.dataset.i18n);
          });
          document.querySelectorAll('[data-i18n-placeholder]').forEach(function (element) {
            element.placeholder = i18n.t(element.dataset.i18nPlaceholder);
          });
          document.title = i18n.t('app.title');
        }

        function textDirection(value) {
          return /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/u.test(value) ? 'rtl' : 'ltr';
        }

        function sizeField(field) {
          field.dir = textDirection(field.value);
          field.style.height = 'auto';
          field.style.height = Math.max(field.scrollHeight + 2, 40) + 'px';
        }

        function render() {
          pool.replaceChildren();
          config.texts.forEach(function (text, index) {
            const row = document.createElement('div');
            row.className = 'row';

            const input = document.createElement('textarea');
            input.rows = 1;
            input.value = text;
            input.setAttribute('aria-label', i18n.t('actions.edit') + ' ' + text);
            input.addEventListener('input', function () {
              sizeField(input);
            });

            const actions = document.createElement('div');
            actions.className = 'actions';

            const save = document.createElement('button');
            save.type = 'button';
            save.textContent = i18n.t('actions.save');
            save.addEventListener('click', async function () {
              const value = input.value.trim();
              if (!value) {
                setStatus(i18n.t('status.emptyText'));
                return;
              }
              config.texts[index] = value;
              await commit();
            });

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'danger';
            remove.textContent = i18n.t('actions.removeShort');
            remove.addEventListener('click', async function () {
              config.texts.splice(index, 1);
              await commit();
            });

            actions.append(save, remove);
            row.append(input, actions);
            pool.append(row);
            sizeField(input);
            requestAnimationFrame(function () {
              sizeField(input);
            });
          });
          document.getElementById('pool-count').textContent = String(config.texts.length);
        }

        async function commit() {
          try {
            const latest = await api.core.invoke('get_config');
            latest.texts = config.texts;
            config = latest;
            await api.core.invoke('save_config', { config: config });
            render();
            setStatus(i18n.t('status.saved'));
          } catch (error) {
            setStatus(i18n.t('status.saveFailed', { error: error }));
          }
        }

        const newText = document.getElementById('new-text');
        newText.addEventListener('input', function () {
          sizeField(newText);
        });
        window.addEventListener('resize', function () {
          document.querySelectorAll('textarea').forEach(sizeField);
        });

        document.getElementById('add-form').addEventListener('submit', async function (event) {
          event.preventDefault();
          const value = newText.value.trim();
          if (!value) {
            setStatus(i18n.t('status.emptyText'));
            return;
          }
          config.texts.push(value);
          newText.value = '';
          sizeField(newText);
          await commit();
        });

        document.getElementById('done').addEventListener('click', function () {
          if (api.window && api.window.getCurrentWindow) {
            api.window.getCurrentWindow().hide();
          }
        });

        async function init() {
          let language = 'en';
          try {
            config = await api.core.invoke('get_config');
            language = config.language || 'en';
          } catch (error) {
            setStatus(i18n.t('status.loadFailed', { error: error }));
          }
          try {
            await i18n.load(language);
            applyTranslations();
          } catch (error) {
            setStatus(String(error));
          }
          render();
          sizeField(newText);
          newText.focus();
        }

        async function refreshFromBackend() {
          try {
            config = await api.core.invoke('get_config');
            await i18n.load(config.language || 'en');
            applyTranslations();
            render();
            sizeField(newText);
          } catch (error) {
            setStatus(String(error));
          }
        }

        if (api.event && api.event.listen) {
          api.event.listen('pool-changed', refreshFromBackend);
          api.event.listen('window-shown', function (event) {
            if (event.payload === 'pool') refreshFromBackend();
          });
        }

        init();
      })();
    </script>
  </body>
</html>
