<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tathkira</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI Variable', 'Segoe UI', ui-sans-serif, system-ui, Tahoma, 'Geeza Pro', sans-serif;
        font-size: 13px;
        --bg: #10110f;
        --panel: #181a17;
        --panel-raised: #1e211d;
        --line: #30342e;
        --line-soft: #262a25;
        --text: #f5f1e6;
        --muted: #aaa99f;
        --faint: #777a70;
        --accent: #d2b27a;
        --accent-strong: #b89355;
        --accent-hover: #e2c58f;
        --accent-ink: #241a0a;
        --accent-wash: rgba(210, 178, 122, 0.1);
        --accent-line: rgba(210, 178, 122, 0.28);
        --danger: #e08b7a;
        --danger-wash: rgba(224, 139, 122, 0.08);
        --danger-line: rgba(224, 139, 122, 0.4);
        --header-bg: rgba(16, 17, 15, 0.96);
        --brand-bg: #1b1a14;
        --field-bg: #141614;
        --field-focus: #191b18;
        --hover-bg: #242821;
        --hover-border: #3b4037;
        --press-bg: #1b1e19;
        --focus: rgba(210, 178, 122, 0.22);
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f7f4ec;
        --panel: #fffdf7;
        --panel-raised: #eee9dc;
        --line: #ded6c5;
        --line-soft: #ebe5d7;
        --text: #262a24;
        --muted: #657066;
        --faint: #8a9289;
        --accent: #8a6b32;
        --accent-strong: #6f5426;
        --accent-hover: #76592a;
        --accent-ink: #fff9e9;
        --accent-wash: rgba(138, 107, 50, 0.1);
        --accent-line: rgba(138, 107, 50, 0.28);
        --danger: #a94337;
        --danger-wash: rgba(169, 67, 55, 0.07);
        --danger-line: rgba(169, 67, 55, 0.35);
        --header-bg: rgba(247, 244, 236, 0.96);
        --brand-bg: #fffdf7;
        --field-bg: #fffef9;
        --field-focus: #fffdf7;
        --hover-bg: #e9e3d5;
        --hover-border: #cfc5b1;
        --press-bg: #ded7c7;
        --focus: rgba(138, 107, 50, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--text);
        background: var(--bg);
      }

      main {
        height: 100vh;
        padding: 0 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        margin: 0 -16px;
        padding: 16px 16px 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--header-bg);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
        user-select: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        position: relative;
        width: 28px;
        height: 28px;
        flex: none;
        border: 1px solid var(--accent-line);
        border-radius: 14px 14px 8px 8px;
        background: var(--brand-bg);
      }

      .brand-mark::before {
        content: '';
        position: absolute;
        inset: 5px 6px 4px;
        border: 1px solid var(--accent-wash);
        border-radius: 9px 9px 4px 4px;
      }

      .brand-mark::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 12px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .count {
        min-width: 26px;
        padding: 3px 8px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-wash);
        border: 1px solid var(--accent-line);
        border-radius: 999px;
      }

      .pool {
        flex: 1;
        min-height: 0;
        padding-inline-end: 2px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }

      .pool::-webkit-scrollbar {
        width: 6px;
      }

      .pool::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .row:first-child {
        padding-top: 2px;
      }

      textarea {
        flex: 1;
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 40px;
        padding: 9px 10px;
        color: var(--text);
        background: var(--field-bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        outline: none;
        font: inherit;
        line-height: 1.5;
        resize: none;
        overflow: hidden;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        text-align: start;
        transition: border-color 130ms ease, box-shadow 130ms ease;
      }

      textarea:focus {
        border-color: var(--accent-strong);
        box-shadow: 0 0 0 3px var(--focus);
      }

      .actions {
        display: grid;
        grid-auto-rows: 28px;
        gap: 6px;
        flex: none;
      }

      button {
        padding: 7px 11px;
        color: var(--text);
        background: var(--panel-raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        transition: background 130ms ease, border-color 130ms ease, color 130ms ease;
      }

      button:hover {
        background: var(--hover-bg);
        border-color: var(--hover-border);
      }

      button:active {
        background: var(--press-bg);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button.primary {
        color: var(--accent-ink);
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 700;
      }

      button.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      button.danger {
        color: var(--danger);
        background: transparent;
        border-color: transparent;
      }

      button.danger:hover {
        color: var(--danger);
        background: var(--danger-wash);
        border-color: var(--danger-line);
      }

      .composer {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .composer:focus-within {
        border-color: var(--accent-line);
        box-shadow: 0 0 0 3px var(--focus);
      }

      .status {
        min-height: 16px;
        font-size: 11px;
        color: var(--accent);
      }

      footer {
        display: flex;
        justify-content: flex-end;
      }

      .wide {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <header data-tauri-drag-region>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 data-i18n="sections.pool"></h1>
        </div>
        <span id="pool-count" class="count">0</span>
      </header>

      <div id="pool" class="pool"></div>

      <form id="add-form" class="composer">
        <textarea id="new-text" rows="1" data-i18n-placeholder="fields.placeholder" placeholder=""></textarea>
        <button type="submit" class="primary" data-i18n="actions.add"></button>
      </form>

      <div id="status" class="status" role="status"></div>
      <footer>
        <button id="done" type="button" class="primary wide" data-i18n="actions.done"></button>
      </footer>
    </main>
    <script src="./i18n.js"></script>
    <script>
      (function () {
        const i18n = window.TathkiraI18n;
        const api = window.__TAURI__;
        const pool = document.getElementById('pool');
        const status = document.getElementById('status');
        let config = { texts: [], language: 'en', theme: 'dark' };
        let statusTimer;

        function setStatus(message) {
          status.textContent = message;
          clearTimeout(statusTimer);
          statusTimer = setTimeout(function () {
            status.textContent = '';
          }, 1600);
        }

        function applyTranslations() {
          document.querySelectorAll('[data-i18n]').forEach(function (element) {
            element.textContent = i18n.t(element.dataset.i18n);
          });
          document.querySelectorAll('[data-i18n-placeholder]').forEach(function (element) {
            element.placeholder = i18n.t(element.dataset.i18nPlaceholder);
          });
          document.title = i18n.t('app.title');
        }

        function applyTheme() {
          const theme = config.theme === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }

        function textDirection(value) {
          return /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/u.test(value) ? 'rtl' : 'ltr';
        }

        function sizeField(field) {
          field.dir = textDirection(field.value);
          field.style.height = 'auto';
          field.style.height = Math.max(field.scrollHeight + 2, 40) + 'px';
        }

        function render() {
          pool.replaceChildren();
          config.texts.forEach(function (text, index) {
            const row = document.createElement('div');
            row.className = 'row';

            const input = document.createElement('textarea');
            input.rows = 1;
            input.value = text;
            input.setAttribute('aria-label', i18n.t('actions.edit') + ' ' + text);
            input.addEventListener('input', function () {
              sizeField(input);
            });

            const actions = document.createElement('div');
            actions.className = 'actions';

            const save = document.createElement('button');
            save.type = 'button';
            save.textContent = i18n.t('actions.save');
            save.addEventListener('click', async function () {
              const value = input.value.trim();
              if (!value) {
                setStatus(i18n.t('status.emptyText'));
                return;
              }
              config.texts[index] = value;
              await commit();
            });

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'danger';
            remove.textContent = i18n.t('actions.removeShort');
            remove.addEventListener('click', async function () {
              config.texts.splice(index, 1);
              await commit();
            });

            actions.append(save, remove);
            row.append(input, actions);
            pool.append(row);
            sizeField(input);
            requestAnimationFrame(function () {
              sizeField(input);
            });
          });
          document.getElementById('pool-count').textContent = String(config.texts.length);
        }

        async function commit() {
          try {
            const latest = await api.core.invoke('get_config');
            latest.texts = config.texts;
            config = latest;
            applyTheme();
            await api.core.invoke('save_config', { config: config });
            render();
            setStatus(i18n.t('status.saved'));
          } catch (error) {
            setStatus(i18n.t('status.saveFailed', { error: error }));
          }
        }

        const newText = document.getElementById('new-text');
        newText.addEventListener('input', function () {
          sizeField(newText);
        });
        window.addEventListener('resize', function () {
          document.querySelectorAll('textarea').forEach(sizeField);
        });

        document.getElementById('add-form').addEventListener('submit', async function (event) {
          event.preventDefault();
          const value = newText.value.trim();
          if (!value) {
            setStatus(i18n.t('status.emptyText'));
            return;
          }
          config.texts.push(value);
          newText.value = '';
          sizeField(newText);
          await commit();
        });

        document.getElementById('done').addEventListener('click', function () {
          if (api.window && api.window.getCurrentWindow) {
            api.window.getCurrentWindow().hide();
          }
        });

        async function init() {
          let language = 'en';
          try {
            config = await api.core.invoke('get_config');
            language = config.language || 'en';
            applyTheme();
          } catch (error) {
            setStatus(i18n.t('status.loadFailed', { error: error }));
          }
          try {
            await i18n.load(language);
            applyTranslations();
          } catch (error) {
            setStatus(String(error));
          }
          render();
          sizeField(newText);
          newText.focus();
        }

        async function refreshFromBackend() {
          try {
            config = await api.core.invoke('get_config');
            applyTheme();
            await i18n.load(config.language || 'en');
            applyTranslations();
            render();
            sizeField(newText);
          } catch (error) {
            setStatus(String(error));
          }
        }

        if (api.event && api.event.listen) {
          api.event.listen('pool-changed', refreshFromBackend);
          api.event.listen('window-shown', function (event) {
            if (event.payload === 'pool') refreshFromBackend();
          });
        }

        init();
      })();
    </script>
  </body>
</html>
