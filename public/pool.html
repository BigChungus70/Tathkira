<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tathkira</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI Variable', 'Segoe UI', ui-sans-serif, system-ui, Tahoma, 'Geeza Pro', sans-serif;
        font-size: 13px;
        --bg: #111110;
        --pool-bg: #17171d;
        --pool-header-bg: rgba(32, 34, 72, 0.55);
        --pool-line: #343362;
        --panel: #191918;
        --panel-raised: #222221;
        --line: #3b3a37;
        --line-soft: #2a2a28;
        --text: #eeeeec;
        --muted: #b5b3ad;
        --faint: #8c8a84;
        --accent: #5b5bd6;
        --accent-hover: #6e6ade;
        --accent-ink: #ffffff;
        --accent-text: #b1a9ff;
        --accent-wash: rgba(91, 91, 214, 0.14);
        --accent-line: rgba(91, 91, 214, 0.38);
        --danger: #b3445a;
        --danger-text: #ff949d;
        --danger-wash: rgba(179, 68, 90, 0.14);
        --danger-line: rgba(255, 148, 157, 0.32);
        --success: #27b08b;
        --brand-bg: #202248;
        --field-bg: #222221;
        --field-focus: #2a2a28;
        --hover-bg: #2a2a28;
        --hover-border: #494844;
        --press-bg: #31312e;
        --focus: rgba(91, 91, 214, 0.28);
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #fdfdfc;
        --pool-bg: #f8f7fe;
        --pool-header-bg: #f0f1fe;
        --pool-line: #c9c8ef;
        --panel: #ffffff;
        --panel-raised: #f1f0ef;
        --line: #dad9d6;
        --line-soft: #e9e8e6;
        --text: #21201c;
        --muted: #63635e;
        --faint: #85847e;
        --accent: #5b5bd6;
        --accent-hover: #5151cd;
        --accent-ink: #ffffff;
        --accent-text: #5b5bd6;
        --accent-wash: #f0f1fe;
        --accent-line: rgba(91, 91, 214, 0.25);
        --danger: #ce2c31;
        --danger-text: #ce2c31;
        --danger-wash: #fdecee;
        --danger-line: rgba(206, 44, 49, 0.3);
        --success: #208368;
        --brand-bg: #f0f1fe;
        --field-bg: #f1f0ef;
        --field-focus: #ffffff;
        --hover-bg: #e9e8e6;
        --hover-border: #bcbbb5;
        --press-bg: #e2e1de;
        --focus: rgba(91, 91, 214, 0.2);
      }

      @media (prefers-color-scheme: light) {
        :root[data-theme='system'] {
          color-scheme: light;
          --bg: #fdfdfc;
          --pool-bg: #f8f7fe;
          --pool-header-bg: #f0f1fe;
          --pool-line: #c9c8ef;
          --panel: #ffffff;
          --panel-raised: #f1f0ef;
          --line: #dad9d6;
          --line-soft: #e9e8e6;
          --text: #21201c;
          --muted: #63635e;
          --faint: #85847e;
          --accent: #5b5bd6;
          --accent-hover: #5151cd;
          --accent-ink: #ffffff;
          --accent-text: #5b5bd6;
          --accent-wash: #f0f1fe;
          --accent-line: rgba(91, 91, 214, 0.25);
          --danger: #ce2c31;
          --danger-text: #ce2c31;
          --danger-wash: #fdecee;
          --danger-line: rgba(206, 44, 49, 0.3);
          --success: #208368;
          --brand-bg: #f0f1fe;
          --field-bg: #f1f0ef;
          --field-focus: #ffffff;
          --hover-bg: #e9e8e6;
          --hover-border: #bcbbb5;
          --press-bg: #e2e1de;
          --focus: rgba(91, 91, 214, 0.2);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--text);
        background: var(--pool-bg);
      }

      .icon {
        width: 15px;
        height: 15px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      main {
        height: 100vh;
        padding: 0 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        margin: 0 -16px;
        padding: 16px 16px 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--pool-header-bg);
        border-top: 3px solid var(--accent);
        border-bottom: 1px solid var(--pool-line);
        backdrop-filter: blur(10px);
        user-select: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        position: relative;
        width: 28px;
        height: 28px;
        flex: none;
        border: 1px solid var(--accent-line);
        border-radius: 14px 14px 8px 8px;
        background: var(--brand-bg);
      }

      .brand-mark::before {
        content: '';
        position: absolute;
        inset: 5px 6px 4px;
        border: 1px solid var(--accent-line);
        border-radius: 9px 9px 4px 4px;
      }

      .brand-mark::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 12px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent-text);
      }

      h1 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0;
      }

      h1 .icon {
        width: 14px;
        height: 14px;
        color: var(--accent-text);
      }

      .count {
        min-width: 26px;
        padding: 3px 8px;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-text);
        background: var(--accent-wash);
        border: 1px solid var(--accent-line);
        border-radius: 999px;
      }

      .count-badge {
        position: absolute;
        inset-block-start: -11px;
        inset-inline-end: 18px;
        z-index: 3;
        background: var(--pool-bg);
        border-color: var(--accent);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      }

      .pool {
        flex: 1;
        min-height: 0;
        padding-inline-end: 2px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }

      .pool::-webkit-scrollbar {
        width: 6px;
      }

      .pool::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .row:first-child {
        padding-top: 2px;
      }

      textarea {
        flex: 1;
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 40px;
        padding: 9px 10px;
        color: var(--text);
        background: var(--field-bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        font: inherit;
        line-height: 1.5;
        resize: none;
        overflow: hidden;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        text-align: start;
        transition: border-color 130ms ease, box-shadow 130ms ease, background 130ms ease;
      }

      textarea:focus {
        background: var(--field-focus);
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--focus);
      }

      .row-remove {
        width: 32px;
        height: 32px;
        padding: 0;
        flex: none;
        align-self: center;
        display: grid;
        place-items: center;
        color: var(--faint);
        background: transparent;
        border-color: transparent;
      }

      .row-remove .icon {
        width: 15px;
        height: 15px;
        display: block;
      }

      .row-remove:hover {
        color: var(--danger-text);
        background: var(--danger-wash);
        border-color: var(--danger-line);
      }

      button {
        padding: 8px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: var(--text);
        background: var(--panel-raised);
        border: 1px solid var(--line);
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        transition: background 130ms ease, border-color 130ms ease, color 130ms ease;
      }

      button:hover {
        background: var(--hover-bg);
        border-color: var(--hover-border);
      }

      button:active {
        background: var(--press-bg);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button.primary {
        color: var(--accent-ink);
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 700;
      }

      button.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .composer {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .composer-icon {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        color: var(--faint);
      }

      .composer-icon .icon,
      .composer button .icon {
        display: block;
        margin: 0;
      }

      .composer:focus-within {
        border-color: var(--accent-line);
        box-shadow: 0 0 0 3px var(--focus);
      }

      .status {
        min-height: 14px;
        padding-inline: 2px;
        font-size: 11px;
        color: var(--success);
      }

      footer {
        display: flex;
        justify-content: flex-end;
      }

      .wide {
        width: 100%;
      }
    </style>
  </head>
  <body class="pool-window">
    <main>
      <header data-tauri-drag-region>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5" /></svg>
            <span data-i18n="sections.pool"></span>
          </h1>
        </div>
        <span id="pool-count" class="count count-badge">0</span>
      </header>

      <div id="pool" class="pool"></div>

      <div id="status" class="status" role="status"></div>

      <form id="add-form" class="composer">
        <span class="composer-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9M4 16.5l10-10 3.5 3.5-10 10H4v-3.5z" /></svg>
        </span>
        <textarea id="new-text" rows="1" data-i18n-placeholder="fields.placeholder" placeholder=""></textarea>
        <button type="submit" class="primary">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span data-i18n="actions.add"></span>
        </button>
      </form>

      <footer>
        <button id="done" type="button" class="primary wide">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6" /></svg>
          <span data-i18n="actions.done"></span>
        </button>
      </footer>
    </main>
    <script src="./i18n.js"></script>
    <script>
      (function () {
        const i18n = window.TathkiraI18n;
        const api = window.__TAURI__;
        const THEME_CHOICES = ['system', 'dark', 'light'];
        const removeIcon = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M8 12h8" /></svg>';
        const pool = document.getElementById('pool');
        const status = document.getElementById('status');
        let config = { texts: [], language: 'en', theme: 'dark' };
        let statusTimer;
        let autosaveTimer;
        let ignorePoolChanged = false;

        function setStatus(message) {
          status.textContent = message;
          clearTimeout(statusTimer);
          statusTimer = setTimeout(function () {
            status.textContent = '';
          }, 1600);
        }

        function applyTranslations() {
          document.querySelectorAll('[data-i18n]').forEach(function (element) {
            element.textContent = i18n.t(element.dataset.i18n);
          });
          document.querySelectorAll('[data-i18n-placeholder]').forEach(function (element) {
            element.placeholder = i18n.t(element.dataset.i18nPlaceholder);
          });
          document.title = i18n.t('app.title');
        }

        function applyTheme() {
          const theme = THEME_CHOICES.indexOf(config.theme) >= 0 ? config.theme : 'dark';
          document.documentElement.dataset.theme = theme;
        }

        function textDirection(value) {
          return /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/u.test(value) ? 'rtl' : 'ltr';
        }

        function sizeField(field) {
          field.dir = textDirection(field.value);
          field.style.height = 'auto';
          field.style.height = Math.max(field.scrollHeight + 2, 40) + 'px';
        }

        function queueAutosave(index, value) {
          const trimmed = value.trim();
          if (!trimmed) {
            setStatus(i18n.t('status.emptyText'));
            return;
          }
          config.texts[index] = trimmed;
          clearTimeout(autosaveTimer);
          autosaveTimer = setTimeout(function () {
            commit({ rerender: false });
          }, 400);
        }

        function render() {
          pool.replaceChildren();
          config.texts.forEach(function (text, index) {
            const row = document.createElement('div');
            row.className = 'row';

            const input = document.createElement('textarea');
            input.rows = 1;
            input.value = text;
            input.setAttribute('aria-label', i18n.t('actions.edit') + ' ' + text);
            input.addEventListener('input', function () {
              sizeField(input);
              queueAutosave(index, input.value);
            });

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'row-remove';
            remove.innerHTML = removeIcon;
            const removeLabel = i18n.t('actions.removeShort') + ' ' + text;
            remove.title = removeLabel;
            remove.setAttribute('aria-label', removeLabel);
            remove.addEventListener('click', async function () {
              clearTimeout(autosaveTimer);
              config.texts.splice(index, 1);
              await commit();
            });

            row.append(input, remove);
            pool.append(row);
            sizeField(input);
            requestAnimationFrame(function () {
              sizeField(input);
            });
          });
          document.getElementById('pool-count').textContent = String(config.texts.length);
        }

        async function commit(options) {
          const rerender = !options || options.rerender !== false;
          ignorePoolChanged = true;
          setTimeout(function () {
            ignorePoolChanged = false;
          }, 1000);
          try {
            const latest = await api.core.invoke('get_config');
            latest.texts = config.texts;
            config = latest;
            applyTheme();
            await api.core.invoke('save_config', { config: config });
            if (rerender) render();
            setStatus(i18n.t('status.saved'));
          } catch (error) {
            setStatus(i18n.t('status.saveFailed', { error: error }));
          }
        }

        const addForm = document.getElementById('add-form');
        const newText = document.getElementById('new-text');
        newText.addEventListener('input', function () {
          sizeField(newText);
        });
        newText.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            addForm.requestSubmit();
          }
        });
        window.addEventListener('resize', function () {
          document.querySelectorAll('textarea').forEach(sizeField);
        });

        addForm.addEventListener('submit', async function (event) {
          event.preventDefault();
          const value = newText.value.trim();
          if (!value) {
            setStatus(i18n.t('status.emptyText'));
            return;
          }
          clearTimeout(autosaveTimer);
          config.texts.push(value);
          newText.value = '';
          sizeField(newText);
          await commit();
        });

        document.getElementById('done').addEventListener('click', function () {
          api.core.invoke('hide_pool').catch(function () {});
        });

        async function init() {
          let language = 'en';
          try {
            config = await api.core.invoke('get_config');
            language = config.language || 'en';
            applyTheme();
          } catch (error) {
            setStatus(i18n.t('status.loadFailed', { error: error }));
          }
          try {
            await i18n.load(language);
            applyTranslations();
          } catch (error) {
            setStatus(String(error));
          }
          render();
          sizeField(newText);
          newText.focus();
        }

        async function refreshFromBackend() {
          try {
            config = await api.core.invoke('get_config');
            applyTheme();
            await i18n.load(config.language || 'en');
            applyTranslations();
            render();
            sizeField(newText);
          } catch (error) {
            setStatus(String(error));
          }
        }

        if (api.event && api.event.listen) {
          api.event.listen('pool-changed', function () {
            if (ignorePoolChanged) {
              ignorePoolChanged = false;
              return;
            }
            refreshFromBackend();
          });
          api.event.listen('window-shown', function (event) {
            if (event.payload === 'pool') refreshFromBackend();
          });
        }

        init();
      })();
    </script>
  </body>
</html>
